<div class="min-h-screen flex items-center justify-center bg-[#f8d3c8] relative overflow-hidden">

  <!-- Fondo con logo tenue -->
  <div class="absolute inset-0 bg-center bg-no-repeat bg-contain opacity-10 animate-pulse-slow"
       style="background-image: url('assets/img/conecta.png');"></div>

  <!-- Contenedor del formulario -->
  <div
    class="relative z-10 p-8 rounded-2xl w-full max-w-sm space-y-6 animate-fade-in-down
           bg-[#f8d3c8] shadow-[6px_6px_12px_#dab6ac,-6px_-6px_12px_#fff0ea]"
  >
    <h2 class="text-2xl font-bold text-center !text-[#955a4b] animate-slide-in">
    INICIAR SESIÓN
    </h2>

    <form (submit)="login(); $event.preventDefault()" class="space-y-4">

      <!-- Usuario -->
      <div class="transition duration-300 hover:scale-[1.02]">
        <label class="block text-sm font-medium text-[#955a4b]">Usuario</label>
        <input type="text" [(ngModel)]="username" name="username"
               class="w-full mt-1 px-4 py-2 rounded-xl border-none
                      bg-[#f8d3c8] shadow-[inset_4px_4px_8px_#dab6ac,inset_-4px_-4px_8px_#fff0ea]
                      focus:outline-none focus:ring-2 focus:ring-[#7a493c] transition"
               required />
      </div>

      <!-- Contraseña -->
      <div class="transition duration-300 hover:scale-[1.02]">
        <label class="block text-sm font-medium text-[#955a4b]">Contraseña</label>
        <div class="relative mt-1">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
                 class="w-full px-4 py-2 pr-12 rounded-xl border-none
                        bg-[#f8d3c8] shadow-[inset_4px_4px_8px_#dab6ac,inset_-4px_-4px_8px_#fff0ea]
                        focus:outline-none focus:ring-2 focus:ring-[#7a493c] transition"
                 required />
          <button type="button" (click)="togglePasswordVisibility()"
                  class="absolute inset-y-0 right-0 flex items-center px-4 text-[#955a4b] hover:text-[#7a493c] focus:outline-none"
                  [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                  [attr.title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7Z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m3 3 18 18M10.584 10.587A2 2 0 0 0 13.414 13.4M9.88 5.09A9.96 9.96 0 0 1 12 5c4.478 0 8.268 2.943 9.542 7a10.13 10.13 0 0 1-3.084 4.568M6.228 6.228C4.53 7.43 3.226 9.43 2.458 12c1.274 4.057 5.065 7 9.542 7 1.61 0 3.132-.38 4.478-1.056" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Error -->
      <div *ngIf="error" class="text-sm text-red-600 text-center animate-fade-in-fast">
        {{ error }}
      </div>

      <!-- Botón -->
      <button type="submit"
              class="w-full py-2 px-4 text-white font-semibold rounded-4
                     bg-[#955a4b] hover:bg-[#7a493c]
                     shadow-[2px_2px_4px_#7a493c,-2px_-2px_4px_#7a493c]
                     hover:shadow-[2px_2px_4px_#7a493c,-2px_-2px_4px_#7a493c]
                     transition-all duration-300">
        Entrar
      </button>

    </form>
  </div>
</div>
